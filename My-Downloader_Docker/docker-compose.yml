# Place this at: My-Downloader_Docker/docker-compose.yml
#
# Usage (run from inside the My-Downloader_Docker folder):
#   docker compose run --rm app
#
# --rm cleans up the container after you exit. Your .py edits at the repo
# root are picked up live via the volume mount -- no rebuild needed unless
# you change the Dockerfile itself.


services:
  app:
    build:
      context: ..                        # repo root, one level up -- where MyDownloader.py actually lives
      dockerfile: My-Downloader_Docker/Dockerfile
    stdin_open: true   # equivalent to -i
    tty: true           # equivalent to -t -- required, this is an input()-driven menu
    volumes:
      - ..:/app          # live-mounts the whole repo root, not just this subfolder
    working_dir: /app